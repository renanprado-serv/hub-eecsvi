<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUB EEC - Equipe Curricular</title>
  
  <!-- Fonte Arredondada (Nunito) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,1,0" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.65);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    body {
      font-family: 'Nunito', sans-serif;
      /* Fundo Apple macOS Style */
      background-color: #f5f5f7;
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 113, 227, 0.1) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
      color: #1d1d1f;
      -webkit-font-smoothing: antialiased;
    }

    /* Classe base do Liquid Glass */
    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 24px;
    }

    /* Botão Primário Apple */
    .btn-apple {
      background: #0071e3;
      color: #fff;
      border-radius: 980px;
      padding: 10px 24px;
      font-weight: 700;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-apple:hover {
      background: #0077ed;
      transform: scale(1.02);
    }

    /* Ajuste para rolagem suave */
    .scroll-container::-webkit-scrollbar { width: 6px; }
    .scroll-container::-webkit-scrollbar-track { background: transparent; }
    .scroll-container::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen p-6 md:p-12">

  <div class="max-w-5xl mx-auto">
    
    <!-- Cabeçalho -->
    <header class="liquid-glass p-6 mb-8 flex justify-between items-center">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-500 flex items-center justify-center text-white shadow-md">
          <span class="material-symbols-rounded text-3xl">grid_view</span>
        </div>
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight text-gray-900">HUB EEC</h1>
          <p class="text-sm font-semibold text-gray-500">Equipe Curricular Central</p>
        </div>
      </div>
      <div id="statusBadge" class="px-4 py-2 rounded-full text-sm font-bold bg-gray-200 text-gray-600 flex items-center gap-2">
        <span class="material-symbols-rounded animate-spin text-lg">sync</span> Conectando...
      </div>
    </header>

    <!-- Área Principal (Grid) -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-8">
      
      <!-- Card: Repositório de Documentos -->
      <section class="liquid-glass p-8 md:col-span-2 flex flex-col h-[500px]">
        <div class="flex justify-between items-center mb-6">
          <div>
            <h2 class="text-xl font-bold flex items-center gap-2">
              <span class="material-symbols-rounded text-blue-500">folder_open</span> 
              Documentos Orientadores
            </h2>
            <p class="text-sm text-gray-500 mt-1">Boletins e diretrizes sincronizados via Drive.</p>
          </div>
          <button onclick="carregarDocumentos()" class="btn-apple text-sm px-4 py-2">
            <span class="material-symbols-rounded text-sm">refresh</span> Atualizar
          </button>
        </div>

        <!-- Lista de Arquivos -->
        <div id="listaDocs" class="scroll-container overflow-y-auto flex-1 pr-2 flex flex-col gap-3">
          <div class="text-center text-gray-400 py-10 font-semibold">
            Aguardando conexão com o Google Drive...
          </div>
        </div>
      </section>

      <!-- Card: Atalhos / Ações Rápidas (Espaço reservado para o futuro) -->
      <section class="liquid-glass p-8 flex flex-col">
        <h2 class="text-xl font-bold flex items-center gap-2 mb-6">
          <span class="material-symbols-rounded text-indigo-500">bolt</span> 
          Ações Rápidas
        </h2>
        <div class="flex flex-col gap-4">
          <a href="#" class="p-4 rounded-xl border border-white/50 bg-white/40 hover:bg-white/60 transition-colors flex items-center gap-3 font-semibold text-gray-700">
            <span class="material-symbols-rounded text-gray-500">edit_document</span>
            Registrar Relatório
          </a>
          <a href="#" class="p-4 rounded-xl border border-white/50 bg-white/40 hover:bg-white/60 transition-colors flex items-center gap-3 font-semibold text-gray-700">
            <span class="material-symbols-rounded text-gray-500">event</span>
            Agenda Semanal
          </a>
        </div>
      </section>

    </main>
  </div>

  <script>
    // ==========================================
    // COLE A SUA URL DA API DO GOOGLE AQUI
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbyeKk-8SHfpGwYtyJN61WTHc0G-yVUIquKwJq1KVlJHWVNbzmIAsEoaaQiNokUDJuJMnw/exec";

    document.addEventListener('DOMContentLoaded', () => {
      verificarConexao();
      carregarDocumentos();
    });

    function verificarConexao() {
      const badge = document.getElementById('statusBadge');
      if(API_URL.includes("COLE_AQUI")) {
        badge.innerHTML = "API não configurada";
        badge.className = "px-4 py-2 rounded-full text-sm font-bold bg-red-100 text-red-600";
        return;
      }

      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          badge.innerHTML = '<span class="material-symbols-rounded text-lg">cloud_done</span> Online';
          badge.className = "px-4 py-2 rounded-full text-sm font-bold bg-green-100 text-green-700 flex items-center gap-2";
        })
        .catch(() => {
          badge.innerHTML = "Offline";
          badge.className = "px-4 py-2 rounded-full text-sm font-bold bg-red-100 text-red-600";
        });
    }

    function carregarDocumentos() {
      if(API_URL.includes("COLE_AQUI")) return;
      
      const container = document.getElementById('listaDocs');
      container.innerHTML = '<div class="text-center text-gray-500 py-10 font-bold animate-pulse">Buscando documentos...</div>';

      fetch(`${API_URL}?action=getDocumentos`)
        .then(res => res.json())
        .then(res => {
          container.innerHTML = '';
          if (!res.sucesso || res.dados.length === 0) {
            container.innerHTML = '<div class="text-center text-gray-500 py-10 font-bold">Nenhum documento encontrado.</div>';
            return;
          }

          res.dados.forEach(doc => {
            // Criação do Card de Arquivo
            container.innerHTML += `
              <div class="bg-white/50 border border-white/60 p-4 rounded-2xl flex items-center justify-between hover:bg-white/80 transition-all shadow-sm">
                <div class="flex items-center gap-4">
                  <div class="p-2 bg-blue-100/50 rounded-xl">
                    <span class="material-symbols-rounded text-blue-600 text-2xl">description</span>
                  </div>
                  <div>
                    <h3 class="font-bold text-gray-800 text-sm md:text-base">${doc.nome}</h3>
                    <p class="text-xs font-semibold text-gray-500 mt-0.5">Adicionado em: ${doc.data}</p>
                  </div>
                </div>
                <a href="${doc.url}" target="_blank" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-full text-sm font-bold transition-colors">
                  Abrir
                </a>
              </div>
            `;
          });
        })
        .catch(() => {
          container.innerHTML = '<div class="text-center text-red-500 py-10 font-bold">Erro ao carregar os documentos.</div>';
        });
    }
  </script>
</body>
</html>
